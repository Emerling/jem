<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Sierra Alta | Jem</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/detail.css">
</head>
<body>

  <a href="../index.html" class="back-btn">← Volver</a>

  <div class="detail__hero">
    <img src="../img/cafe.jpeg" alt="Café Sierra Alta">
  </div>

  <main class="detail__contenido">
    <span class="etiqueta-seccion">Proyecto</span>
    <h1 class="titular">Café Sierra Alta</h1>
    <p class="detail__meta">Identidad visual · Packaging — 2025</p>

    <div class="detail__descripcion">
      <p>Rediseño de identidad para una marca de café de especialidad...</p>
      <p>El sistema visual se basa en...</p>
    </div>

    <section class="detail__seccion">
      <h2>Características</h2>
      <div class="chip-list">
        <span class="chip">Logotipo</span>
        <span class="chip">Packaging</span>
        <span class="chip">Paleta</span>
        <span class="chip">Tipografía</span>
      </div>
    </section>

    <section class="detail__seccion">
      <h2>Herramientas</h2>
      <div class="chip-list">
        <span class="chip">Illustrator</span>
        <span class="chip">Photoshop</span>
      </div>
    </section>

    <section class="detail__seccion">
      <h2>Galería</h2>
      <div class="galeria">
        <img src="../img/cafe-1.jpg" data-lightbox>
        <img src="../img/cafe-2.jpg" data-lightbox>
        <img src="../img/cafe-3.jpg" data-lightbox>
      </div>
    </section>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox__cerrar" onclick="cerrar()">&times;</button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    document.querySelectorAll('[data-lightbox]').forEach(img => {
      img.onclick = () => { lbImg.src = img.src; lb.classList.add('activo'); };
    });
    function cerrar() { lb.classList.remove('activo'); }
    lb.onclick = e => { if(e.target === lb) cerrar(); };
    document.onkeydown = e => { if(e.key === 'Escape') cerrar(); };
  </script>
</body>
</html>
